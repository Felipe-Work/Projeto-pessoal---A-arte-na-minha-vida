<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../home.css">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->

</head>

<body>

    <header class="header">
        <section>
            <a href="index.html" class="logo">
                <img src="../imagens/pincel.png" alt="logo" width="50px" height="50px">
            </a>

            <nav class="navbar">
                <a href="../index.html">Home</a>
                <a href="cadastro.html">Cadastro</a>
                <a href="login.html">Login</a>
            </nav>


        </section>
    </header>
    <div class="dashboard">
<br> <br> <br> <br> <br>
        <h1 class="tituloDashboard"> Dashboard </h1>

        <div class="kpis">
            <div class="card">
                <h3>Média antes da leitura</h3>
                <span id="mediaAntes">0</span>
            </div>

            <div class="card">
                <h3>Média pós leitura</h3>
                <span id="mediaDepois">0</span>
            </div>

            <div class="card">
                <h3>Menor nota registrada pós leitura</h3>
                <span id="menorNota">0</span>
                <div class="subInfo" id="nomeMenorNota"> Usuário </div>
            </div>

            <div class="card">
                <h3>Quantidade de nota 10</h3>
                <span id="nota10">0</span>
            </div>

        </div>

        <div class="graficoContainer">
            <canvas id="myChartCanvas"></canvas>
        </div>

    </div>

    <section class="footer">
        <div class="share">
            <a href="https://www.instagram.com/itz_lipe01/"><img
                    src="../imagens/instagram-logo-instagram-icon-transparent-free-png.webp" alt="instagram" width="100"
                    height="100"></a>
        </div>
    </section>

</body>

</html>

<script>
  
    let proximaAtualizacao;

    window.onload = carregarDashboard(); obterDadosGrafico();

    function carregarDashboard() {

        fetch("/usuarios/kpis").then(

            function (response) {
                response.json().then(

                    function (dados) {

                        document.getElementById("mediaAntes").innerHTML = dados.MediaAntes;
                        document.getElementById("mediaDepois").innerHTML = dados.MediaDepois;
                        document.getElementById("menorNota").innerHTML = dados.nota_depois;
                        document.getElementById("nomeMenorNota").innerHTML = dados.nome;
                        document.getElementById("nota10").innerHTML = dados.qtdNota10;
                    }
                )
            }
        )
    }

    // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
    // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
    // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function obterDadosGrafico() {

    

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/usuarios/grafico`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                   

                    plotarGrafico(resposta);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
    // A função *plotarGrafico* também invoca a função *atualizarGrafico*
    function plotarGrafico(resposta) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Nota Antes',
                data: [],
                fill: false,
                borderColor: 'rgb(50,205,50)',
                tension: 0.1
            },
            {
                label: 'Nota Depois',
                data: [],
                fill: false,
                borderColor: 'rgb(0,0,205)',
                tension: 0.1
            }]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.nome);
            dados.datasets[0].data.push(registro.nota_antes);
            dados.datasets[1].data.push(registro.nota_depois);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'bar',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChartCanvas`),
            config
        );

        setTimeout(() => atualizarGrafico(dados, myChart), 2000);
    }


    // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas, 

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function atualizarGrafico(dados, myChart) {



        fetch(`/usuarios/grafico`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (response) {

                    
                    // alertar(response, idAquario);
                    console.log(`Dados recebidos: ${JSON.stringify(response)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);
                    console.log("novo registro: " + response.nome)
                    console.log("novo registro: " + response.nota_antes)

                   
                        // tirando e colocando valores no gráfico
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(response.nome); // incluir um novo momento

                        dados.datasets[0].data.shift();  // apagar o primeiro de umidade
                        dados.datasets[0].data.push(response.nota_antes); // incluir uma nova medida de umidade

                        dados.datasets[1].data.shift();  // apagar o primeiro de temperatura
                        dados.datasets[1].data.push(response.nota_depois); // incluir uma nova medida de temperatura

                        myChart.update();
                        carregarDashboard();
                    

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
                    
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }


</script>
