            <div class="box-container">
                <div class="box2">
                    <h2 class="titulo">Cadastro</h2>
                    <div class="box-container2">
                        <p>Nome completo</p> <br>
                        <input class="input" type="" name="" id="nome_ipt" placeholder="insira seu nome completo"> <br>

                        <br> <br>

                        <p class="senhared" id="maiuscula">Mínimo uma letra maiúscula</p> <br>
                        <p class="senhared" id="minuscula">Mínimo uma letra minúscula</p> <br>
                        <p class="senhared" id="numero">Contenha um número</p> <br> <br> <br>
                        <p>Confirmar senha</p> <br>
                        <input class="input" type="password" name="" id="confirmar_ipt" placeholder="Felipe#2026"> <br> <br>

           <a href="https://www.instagram.com/itz_lipe01/"><img src="instagram-logo-instagram-icon-transparent-free-png.webp" alt="instagram" width="100" height="100" ></a>

</html>
<script>
    let ax_senha_especiais = false
    let ax_senha_maisucula = false
    let ax_senha_minuscula = false
    let ax_senha_numero = false
    let ax_senha_minimo = false
    function cadastrar() {

        let email = email_ipt.value
        let nome = nome_ipt.value
        let cpf = cpf_ipt.value
        let senha = senha_ipt.value
        let confirmar = confirmar_ipt.value
        ax_senha_especiais = false
        ax_senha_maisucula = false
        ax_senha_minuscula = false
        ax_senha_numero = false
        ax_senha_minimo = false
        let especiais = document.getElementById("especiais")
        let maiuscula = document.getElementById("maiuscula")
        let minuscula = document.getElementById("minuscula")
        let numero = document.getElementById("numero")
        let minimo = document.getElementById("minimo")


        if (senha.length >= 8) {

            ax_senha_minimo = true
        }
        for (let i = 0; i < senha.length; i++) {

            if (senha[i] == '@' || senha[i] == '&' || senha[i] == '$' || senha[i] == '#') {

                ax_senha_especiais = true
                break
            }
        }
        for (let i = 0; i < senha.length; i++) {
            if (
                senha[i] == 'A' || senha[i] == 'B' || senha[i] == 'C' || senha[i] == 'D' ||
                senha[i] == 'E' || senha[i] == 'F' || senha[i] == 'G' || senha[i] == 'H'
                || senha[i] == 'I' || senha[i] == 'J' || senha[i] == 'K' || senha[i] == 'L'
                || senha[i] == 'M' || senha[i] == 'N' || senha[i] == 'O' || senha[i] == 'P'
                || senha[i] == 'Q' || senha[i] == 'R' || senha[i] == 'S' || senha[i] == 'T'
                || senha[i] == 'U' || senha[i] == 'V' || senha[i] == 'W' || senha[i] == 'X'
                || senha[i] == 'Y' || senha[i] == 'Z'
            ) {

                ax_senha_maisucula = true
                break
            }
        }
        for (let i = 0; i < senha.length; i++) {
            if (
                senha[i] == 'a' || senha[i] == 'b' || senha[i] == 'c' || senha[i] == 'd' ||
                senha[i] == 'e' || senha[i] == 'f' || senha[i] == 'g' || senha[i] == 'h'
                || senha[i] == 'i' || senha[i] == 'j' || senha[i] == 'k' || senha[i] == 'l'
                || senha[i] == 'm' || senha[i] == 'n' || senha[i] == 'o' || senha[i] == 'p'
                || senha[i] == 'q' || senha[i] == 'r' || senha[i] == 's' || senha[i] == 't'
                || senha[i] == 'u' || senha[i] == 'v' || senha[i] == 'w' || senha[i] == 'x'
                || senha[i] == 'y' || senha[i] == 'z'
            ) {

                ax_senha_minuscula = true
                break
            }

        }
        for (let i = 0; i < senha.length; i++) {
            if (senha[i] == '0' || senha[i] == '1' || senha[i] == '2' || senha[i] == '3' ||
                senha[i] == '4' || senha[i] == '5' || senha[i] == '6' || senha[i] == '7' ||
                senha[i] == '8' || senha[i] == '9'
            ) {

                ax_senha_numero = true
                break
            }
        }

        if (ax_senha_especiais == false) {
            especiais.innerHTML = `<p class="senhared" id="especiais">Contenha algum dos caracteres especiais: @, &, $, #</p>`
        } else {
            especiais.innerHTML = `<p class="senhagreen" id="especiais">Contenha algum dos caracteres especiais: @, &, $, #</p>`
        }
        if (ax_senha_maisucula == false) {
            maiuscula.innerHTML = `<p class="senhared" id="maiuscula">Mínimo uma letra maiúscula</p>`
        } else {
            maiuscula.innerHTML = `<p class="senhagreen" id="maiuscula">Mínimo uma letra maiúscula</p>`
        }
        if (ax_senha_minimo == false) {
            minimo.innerHTML = `<p class="senhared" id="minimo">Mínimo 8 caracteres</p>`
        } else {
            minimo.innerHTML = `<p class="senhagreen" id="minimo">Mínimo 8 caracteres</p>`
        }
        if (ax_senha_minuscula == false) {
            minuscula.innerHTML = `<p class="senhared" id="minuscula">Mínimo uma letra minúscula</p>`
        } else {
            minuscula.innerHTML = `<p class="senhagreen" id="minuscula">Mínimo uma letra minúscula</p>`
        }
        if (ax_senha_numero == false) {
            numero.innerHTML = `<p class="senhared" id="numero">Contenha um número</p>`
        } else {
            numero.innerHTML = `<p class="senhagreen" id="numero">Contenha um número</p>`
        }
        if (nome.length == 0) {
            alert('Insira um nome válido para cadastro')
        } else {

            if (cpf.length !== 11) {

                alert('Insira um CPF válido para cadastro')

            }
            else {
                if (email.length == 0) {
                    alert('Insira um email válido para cadastro')
                }
                else {
                   
                        if ((ax_senha_especiais == true && ax_senha_maisucula == true &&
                            ax_senha_minimo == true && ax_senha_minuscula == true &&
                            ax_senha_numero == true)
                        ) {
                            if (senha == confirmar) {
                                fetch("/usuarios/cadastrar", {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json",
                                    },
                                    body: JSON.stringify({
                                        // crie um atributo que recebe o valor recuperado aqui 
                                        // Agora vá para o arquivo routes/usuario.js 
                                        nomeServer: nome,
                                        emailServer: email,
                                        senhaServer: senha,
                                        cpfServer: cpf
                                    }),
                                })
                                    .then(function (resposta) {
                                        console.log("resposta: ", resposta);
                                        if (resposta.ok) {
                                          alert("Cadastro realizado com sucesso! Redirecionando para tela de Login...")
                                            setTimeout(() => {
                                                window.location.href = "login.html";
                                            }, "2000");
                                            limparFormulario();
                                            finalizarAguardar();
                                        } else {
                                            throw "Houve um erro ao tentar realizar o cadastro!";
                                        }
                                    })
                                    .catch(function (resposta) {
                                        console.log(`#ERRO: ${resposta}`);
                                    });
                                return false;
                            
                        }
                        else {
                            alert('A senha deve ser igual em ambas as inputs')
                        }
                    }
                    else {
                        alert('Todos os critérios da senha ainda não foram atendidos')
                    }

                }
                    
                }
            }

        }
    


</script>
