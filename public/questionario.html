<h3 class="titulo">.</h3>

                        <br> <br> <br>

<script>
    function confirmar() {
        let nota_antes = Number(antiga_nota_ipt.value)
        let nota_depois = Number(nova_nota_ipt.value)
        let booleana = booleana_ipt.value
        let gostou = gostou_ipt.value
        let ID_USUARIO = sessionStorage.getItem("ID_USUARIO")

        if (nota_antes >= 0 && nota_antes <= 10 && nota_depois >= 0 && nota_depois <= 10 ) {
            if (gostou.length > 0) {
                    fetch("/usuarios/questionario", {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json",
                                    },
                                    body: JSON.stringify({
                                        // crie um atributo que recebe o valor recuperado aqui 
                                        // Agora vá para o arquivo routes/usuario.js 
                                        nota_antesServer: nota_antes,
                                        nota_depoisServer: nota_depois,
                                        booleanaServer: booleana,
                                        gostouServer: gostou,
                                        ID_USUARIOServer: ID_USUARIO
                                    }),
                                })
                                    .then(function (resposta) {
                                        console.log("resposta: ", resposta);
                                        if (resposta.ok) {
                                          alert("Questionário respondido com sucesso! Redirecionando para tela da Dashboard...")
                                            setTimeout(() => {
                                                window.location.href = "dashboard/dashboard.html";
                                            }, "2000");
                                            limparFormulario();
                                            finalizarAguardar();
                                        } else {
                                            throw "Houve um erro ao tentar responder o questionário!";
                                        }
                                    })
                                    .catch(function (resposta) {
                                        console.log(`#ERRO: ${resposta}`);
                                    });
                                return false;
}
            else {
                alert('Insira um texto válido!')
            }
        }
        else {
            alert('Insira uma nota válida!')
        }
    }
</script>
