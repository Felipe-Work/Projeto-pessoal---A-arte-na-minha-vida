<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@75..100,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <section>
            <a href="index.html" class="logo">
                <img src="imagens/pincel.png" alt="logo" width="50px" height="50px">
            </a>

            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="cadastro.html">Cadastro</a>
                <a href="login.html">Login</a>
            </nav>


        </section>
    </header>


    <div class="CL">
        <main class="containerCL">
            <div>
                <div class="textos">
                    <h1 class="cor">Login</h1>
                    <p>Email</p>
                    <div class="inputBox">
                        <input class="input" type="text" name="" id="email_ipt" placeholder="felipe.maia@sptech.school">
                    </div>
                    <p>Senha</p>
                    <div class="inputBox">
                        <input class="input" type="password" name="" id="senha_ipt" placeholder="#SPTech1SIS">
                    </div>
                    <button onclick="login()" class="botaoLogin">Login</button>
                    <div class="registro">
                        <p>ainda não possui uma conta? <a href="cadastro.html" class="possuiconta">cadastre-se</a></p>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <section class="footer">
        <div class="share">
            <p>Contato:</p>
            <a href="https://www.instagram.com/itz_lipe01/"><img
                    src="imagens/instagram-logo-instagram-icon-transparent-free-png.webp" alt="instagram" width="100"
                    height="100"></a>
        </div>
    </section>
</body>




</html>
<script>
    function login() {

        let email = email_ipt.value
        let senha = senha_ipt.value

        if (email.length == 0) {
            alert('Insira um email válido para login')
        }
        else if (senha.length == 0) {
            alert('Insira uma senha válida para login')
        }
        else {
            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;

alert("Login realizado com sucesso! Redirecionando para a página principal...")
                        setTimeout(function () {
                            window.location.href = "principal.html";
                        }, 1000); // apenas para exibir o loading

                    });

                } else {
                    alert("Email ou senha inválidos!")
                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {
                        console.error(texto);
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            })

            return false;
        }


    }


</script>
